[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "code-migration"
version = "0.1.0"
description = "LangGraph pipeline that migrates a small repo between languages"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
claude = ["anthropic"]

[project.scripts]
code-migration = "cli:main"

[tool.setuptools]
packages = ["graph_algorithms", "kb", "nodes", "parser"]
py-modules = ["cli", "config", "graph", "llm", "report", "runner", "schemas", "state"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
